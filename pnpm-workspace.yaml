  js-yaml: ^4.3.2
  nanoid: ^3.3.18
  hono: ^4.13.13
  smol-toml: ^1.9.1
  undici: ^7.30.1
  linkify-it: ^5.0.2
  brace-expansion@1: ^1.1.21
  brace-expansion@5: ^5.0.12
  fast-uri@3: ^3.1.9
  ip-address@10: ^10.7.4
  "@hono/node-server": ^2.1.3
  katex: ^0.18.2
  source-map-js: ^1.2.2
